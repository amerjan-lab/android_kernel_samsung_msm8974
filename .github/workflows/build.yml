name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y bc bison build-essential ccache curl flex gcc-8 g++-8 git gnupg gperf imagemagick liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 ca-certificates lib32z1 lib32stdc++6
          ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download GCC 4.9
        run: |
          HOST="https://github.com"
          REPO="/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"
          git clone --depth=1 "${HOST}${REPO}" -b lineage-17.1 toolchain

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch DTC & Build Kernel
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/toolchain/bin/arm-linux-androideabi-
          mkdir -p out
          make O=out HOSTCC="gcc-8" lineage_klte_bcm2079x_defconfig
          make -j$(nproc) O=out PYTHON=python2 HOSTCC="gcc-8" KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          HOST="https://github.com"
          AK="/osm0sis/AnyKernel3.git"
          git clone --depth=1 "${HOST}${AK}"
          cp out/arch/arm/boot/zImage-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          zip -r9 ../NetHunter-klte-RT3070.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-klte-RT3070
          path: NetHunter-klte-RT3070.zip
